{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">

    <title>Contact Me</title>
</head>

<body>

    <!-- Navbar -->

    <header class="site-header">
        <nav class="navbar">

            <a class="brand" href="{% url 'home' %}">{{ profile.name }}</a>

            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'contact' %}">Contact</a>
                <a href="{% url 'resume' %}">Resume</a>
            </div>

            <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
                🌙
            </button>

        </nav>
    </header>


    <!-- Contact Form -->

    <section class="contact-hero">

        <p class="eyebrow">Get in touch</p>
        <h1>Contact Me</h1>
        <p class="contact-lead">
            Have a project in mind or just want to say hello? Fill out the
            form below and I'll get back to you.
        </p>

        <form class="contact-form" method="POST">

            {% csrf_token %}

            <div class="form-row">
                <label for="id_name">Name</label>
                <input id="id_name" type="text" name="name" required>
            </div>

            <div class="form-row">
                <label for="id_email">Email</label>
                <input id="id_email" type="email" name="email" required>
            </div>

            <div class="form-row">
                <label for="id_subject">Subject</label>
                <input id="id_subject" type="text" name="subject" required>
            </div>

            <div class="form-row">
                <label for="id_message">Message</label>
                <textarea id="id_message" name="message" rows="5" required></textarea>
            </div>

            <div class="form-row">
                <label for="id_contact">Contact number <span class="optional">(optional)</span></label>
                <input id="id_contact" type="text" name="contact">
            </div>

            <button class="submit-btn" type="submit">
                Send message
            </button>

        </form>

    </section>

    <script src="{% static 'js/index.js' %}"></script>

</body>

</html>
